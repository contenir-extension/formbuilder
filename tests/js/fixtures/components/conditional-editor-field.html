<div class="builder__rules" data-conditional-editor data-valueless-ops='["is_empty","is_not_empty"]' data-combinator="all">
                <div class="builder__rules" data-conditional-rows>
                </div>
                <template data-conditional-template><div class="builder__rule" data-conditional-row><span class="builder__handle" data-handle data-tooltip="Drag to reorder" aria-hidden="true"><svg class="icon" data-icon="grip-vertical" aria-hidden="true"></svg></span><span data-conditional-combinator-slot><select name="conditional[combinator]" class="select select--auto" aria-label="Combine with" data-conditional-combinator><option value="all" selected>And</option><option value="any">Or</option></select></span><select name="conditional[conditions][__INDEX__][field]" class="select" aria-label="Field"><option value="">Select a field</option><option value="email">Email</option><option value="message">Message</option><option value="reference">Reference</option></select><select name="conditional[conditions][__INDEX__][op]" class="select" aria-label="Condition" data-conditional-op><option value="equals">is equal to</option><option value="not_equals">is not equal to</option><option value="contains">contains</option><option value="is_empty">is empty</option><option value="is_not_empty">is not empty</option></select><input type="text" name="conditional[conditions][__INDEX__][value]" class="input" value="" placeholder="Value" aria-label="Value" data-conditional-value><button type="button" class="btn btn--ghost btn--icon btn--sm" data-conditional-remove aria-label="Remove condition" data-tooltip="Remove condition"><svg class="icon" data-icon="trash" aria-hidden="true"></svg></button></div></template>
